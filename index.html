<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Klikkaa tästä!</title>
<style>
  * { box-sizing: border-box; }
  html { background: #000; }
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; padding: 32px 20px 24px; color: #fff; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: transparent; }

  .bg { position: fixed; inset: 0; overflow: hidden; z-index: -1; background: #000; }
  .bg span { position: absolute; width: 50vmax; height: 50vmax; border-radius: 50%; filter: blur(90px); opacity: .4; animation: drift 18s ease-in-out infinite alternate; }
  .bg span:nth-child(1) { background: #7c3aed; top: -15vmax; left: -10vmax; }
  .bg span:nth-child(2) { background: #06b6d4; bottom: -20vmax; right: -10vmax; animation-duration: 24s; animation-delay: -6s; }
  .bg span:nth-child(3) { background: #ec4899; top: 30%; left: 40%; width: 35vmax; height: 35vmax; animation-duration: 20s; animation-delay: -12s; }
  .bg::after { content: ""; position: absolute; inset: 0; background-image: linear-gradient(rgba(255,255,255,.04) 1px, transparent 1px), linear-gradient(90deg, rgba(255,255,255,.04) 1px, transparent 1px); background-size: 48px 48px; animation: grid 12s linear infinite; }

  @keyframes drift {
    0%   { transform: translate(0, 0) scale(1); }
    50%  { transform: translate(12vmax, 8vmax) scale(1.25); }
    100% { transform: translate(-8vmax, 14vmax) scale(.9); }
  }
  @keyframes grid { to { background-position: 48px 48px; } }

  main { flex: 1; display: flex; align-items: center; justify-content: center; text-align: center; }
  main a { color: #fff; font-size: clamp(2rem, 7vw, 4rem); font-weight: 700; text-decoration: underline; text-underline-offset: 8px; text-shadow: 0 0 24px rgba(154,194,255,.7), 0 0 60px rgba(124,58,237,.6); transition: transform .2s; }
  main a:hover { color: #cfe2ff; transform: scale(1.06); }

  footer { text-align: center; color: #999; font-size: .85rem; line-height: 1.8; }
  footer a { color: #bbb; }

  @media (prefers-reduced-motion: reduce) { .bg span, .bg::after { animation: none; } }
</style>
</head>
<body>
  <div class="bg"><span></span><span></span><span></span></div>

  <main>
    <a href="https://youtu.be/5VbwAFiYsjI?si=oIlIoFIQnGyWx6mV" rel="noopener noreferrer">Klikkaa tästä!</a>
  </main>

  <footer>
    Tämä sivusto ei käytä evästeitä eikä seurantaa. Linkki avaa YouTuben, joka on kolmannen osapuolen palvelu.<br>

  </footer>
</body>
</html>
